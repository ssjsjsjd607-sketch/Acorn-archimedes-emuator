name: Linux, macOS and iOS (from zip)
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the project
        run: unzip -q archimedes-emu.zip
      - name: Install SDL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libudev-dev libdbus-1-dev
      - name: Download SDL2 and Dear ImGui
        working-directory: archimedes-emu
        run: bash scripts/fetch_deps.sh
      - name: Build and test
        working-directory: archimedes-emu
        run: |
          cmake -B build -DARC_STATIC_SDL=ON -DSDL_WAYLAND=OFF -DSDL_KMSDRM=OFF
          cmake --build build -j4
          ctest --test-dir build --output-on-failure
      - name: Package
        working-directory: archimedes-emu
        run: tar czf ../archimedes-linux-x86_64.tar.gz -C build archimedes
      - uses: actions/upload-artifact@v4
        with:
          name: archimedes-linux
          path: archimedes-linux-x86_64.tar.gz

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the project
        run: unzip -q archimedes-emu.zip
      - name: Download SDL2 and Dear ImGui
        working-directory: archimedes-emu
        run: bash scripts/fetch_deps.sh
      - name: Build and test (universal: Apple Silicon + Intel)
        working-directory: archimedes-emu
        run: |
          cmake -B build -DARC_STATIC_SDL=ON -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build -j4
          ctest --test-dir build --output-on-failure
      - name: Sign (ad-hoc) and package the .app
        working-directory: archimedes-emu
        run: |
          codesign --force --deep -s - build/Archimedes.app
          ditto -c -k --keepParent build/Archimedes.app ../Archimedes-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: archimedes-macos
          path: Archimedes-macos.zip

  ios:
    runs-on: macos-14
    continue-on-error: true        # experimental: produces an UNSIGNED .ipa for sideloading
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the project
        run: unzip -q archimedes-emu.zip
      - name: Download SDL2 and Dear ImGui
        working-directory: archimedes-emu
        run: bash scripts/fetch_deps.sh
      - name: Configure
        working-directory: archimedes-emu
        run: cmake -S . -B build-ios -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
      - name: Build
        working-directory: archimedes-emu
        run: >
          xcodebuild -project build-ios/archimedes_emu.xcodeproj -scheme archimedes -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Make an unsigned .ipa
        working-directory: archimedes-emu
        run: |
          APP=$(find build-ios -name "archimedes.app" -type d | head -1)
          rm -rf Payload && mkdir Payload && cp -r "$APP" Payload/
          zip -qr ../archimedes-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: archimedes-ios
          path: archimedes-ios-unsigned.ipa

  release:
    needs: [linux, macos, ios]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish everything as one release (easy to download on a phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ports-${{ github.run_number }}
          name: Archimedes ports ${{ github.run_number }}
          files: dist/*
