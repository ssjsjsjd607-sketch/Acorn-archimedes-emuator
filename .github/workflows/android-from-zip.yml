name: Build Archimedes
on:
  push:
  workflow_dispatch:
    inputs:
      ports:
        description: "Also build Linux, macOS and iOS (macOS minutes cost 10x)"
        type: boolean
        default: false
      mac_runner:
        description: "macOS runner label (try another if one is not supported)"
        type: choice
        options:
          - macos-15-intel
          - macos-15
          - macos-14
          - macos-latest
        default: macos-15-intel

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the project
        run: unzip -q archimedes-emu.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
      - name: Build the APK
        run: bash archimedes-emu/ci/android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: archimedes-android
          path: archimedes-emu/dist/*

  linux:
    if: "github.event_name == 'workflow_dispatch' && inputs.ports"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the project
        run: unzip -q archimedes-emu.zip
      - name: Build for Linux
        run: bash archimedes-emu/ci/linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: archimedes-linux
          path: archimedes-emu/dist/*

  macos:
    if: "github.event_name == 'workflow_dispatch' && inputs.ports"
    runs-on: ${{ inputs.mac_runner }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the project
        run: unzip -q archimedes-emu.zip
      - name: Build for macOS
        run: bash archimedes-emu/ci/macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: archimedes-macos
          path: archimedes-emu/dist/*

  ios:
    if: "github.event_name == 'workflow_dispatch' && inputs.ports"
    runs-on: ${{ inputs.mac_runner }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the project
        run: unzip -q archimedes-emu.zip
      - name: Build for iOS (unsigned)
        run: bash archimedes-emu/ci/ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: archimedes-ios
          path: archimedes-emu/dist/*

  release:
    needs: [android, linux, macos, ios]
    if: "!cancelled()"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish a release with every build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Archimedes build ${{ github.run_number }}
          files: dist/*
