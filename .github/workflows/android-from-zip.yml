name: Android APK (from zip)
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the project
        run: unzip -q archimedes-emu.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download SDL2 and Dear ImGui
        working-directory: archimedes-emu
        run: bash scripts/fetch_deps.sh

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build the APK
        working-directory: archimedes-emu
        run: gradle -p android assembleDebug --no-daemon

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: archimedes-android-apk
          path: archimedes-emu/android/app/build/outputs/apk/debug/*.apk

      - name: Publish the APK as a release (easy to download on a phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Archimedes build ${{ github.run_number }}
          files: archimedes-emu/android/app/build/outputs/apk/debug/*.apk
